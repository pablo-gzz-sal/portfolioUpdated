    <style>
      html.app-loading,
      html.app-loading body {
        min-height: 100%;
        overflow: hidden;
        background: #0b0b0a;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(126, 188, 214, 0.16), transparent 34rem),
          #0b0b0a;
        color: #eee9dc;
        transition:
          opacity 260ms cubic-bezier(0.23, 1, 0.32, 1),
          visibility 260ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .boot-mark {
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      .boot-ring {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 1px solid rgba(238, 233, 220, 0.18);
        border-top-color: rgba(182, 221, 234, 0.95);
        box-shadow: 0 0 32px rgba(0, 0, 0, 0.32);
        animation: boot-spin 850ms linear infinite;
      }

      .boot-name {
        margin: 0;
        color: rgba(238, 233, 220, 0.72);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      html.app-ready,
      html.app-ready body {
        overflow: auto;
      }

      html.app-ready .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-screen {
          transition: none;
        }

        .boot-ring {
          animation: none;
        }
      }
    </style>
