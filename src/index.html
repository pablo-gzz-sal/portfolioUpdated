<!doctype html>
<html lang="en" class="app-loading">
  <head>
    <meta charset="utf-8" />
    <title>Pablo Salcido — Full-Stack Developer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Full-stack developer specializing in Angular, Node.js, and modern UX. Building premium digital products from pixel to production." />
    <meta name="theme-color" content="#060609" />
    <link rel="icon" type="image/png" href="/assets/images/me.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html.app-loading,
      html.app-loading body {
        min-height: 100%;
        overflow: hidden;
        background: #060609;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(139, 92, 246, 0.18), transparent 34rem),
          #060609;
        color: #e8e4ff;
        transition: opacity 360ms ease, visibility 360ms ease;
      }

      .boot-mark {
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      .boot-ring {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 1px solid rgba(196, 181, 253, 0.22);
        border-top-color: rgba(196, 181, 253, 0.95);
        box-shadow: 0 0 32px rgba(109, 40, 217, 0.28);
        animation: boot-spin 850ms linear infinite;
      }

      .boot-name {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(232, 228, 255, 0.72);
      }

      html.app-ready,
      html.app-ready body {
        overflow: auto;
      }

      html.app-ready .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-screen {
          transition: none;
        }

        .boot-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <div class="boot-screen" aria-hidden="true">
      <div class="boot-mark">
        <div class="boot-ring"></div>
        <p class="boot-name">Pablo Salcido</p>
      </div>
    </div>
  </body>
</html>
