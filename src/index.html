<!doctype html>
<html lang="en" class="app-loading">
  <head>
    <meta charset="utf-8" />
    <title>Pablo Salcido | Full-Stack Engineer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Full-stack engineer specializing in Angular, Node.js, and production-ready digital products with premium UX."
    />
    <meta name="theme-color" content="#0b0b0a" />
    <link rel="icon" type="image/png" href="/assets/images/me.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;650;700;800&family=Geist+Mono:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html.app-loading,
      html.app-loading body {
        min-height: 100%;
        overflow: hidden;
        background: #0b0b0a;
      }

      .boot-screen {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 42%, rgba(126, 188, 214, 0.16), transparent 34rem),
          #0b0b0a;
        color: #eee9dc;
        transition:
          opacity 260ms cubic-bezier(0.23, 1, 0.32, 1),
          visibility 260ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .boot-mark {
        display: grid;
        gap: 18px;
        justify-items: center;
      }

      .boot-ring {
        width: 54px;
        height: 54px;
        border-radius: 999px;
        border: 1px solid rgba(238, 233, 220, 0.18);
        border-top-color: rgba(182, 221, 234, 0.95);
        box-shadow: 0 0 32px rgba(0, 0, 0, 0.32);
        animation: boot-spin 850ms linear infinite;
      }

      .boot-name {
        margin: 0;
        color: rgba(238, 233, 220, 0.72);
        font-family: 'Geist', ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      html.app-ready,
      html.app-ready body {
        overflow: auto;
      }

      html.app-ready .boot-screen {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-screen {
          transition: none;
        }

        .boot-ring {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
    <div class="boot-screen" aria-hidden="true">
      <div class="boot-mark">
        <div class="boot-ring"></div>
        <p class="boot-name">Pablo Salcido</p>
      </div>
    </div>
  </body>
</html>
