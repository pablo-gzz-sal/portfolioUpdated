<section id="tech" class="page-wrap section-space pt-0">
  <div class="knowledge-header grid gap-6 lg:grid-cols-[.75fr_1fr] lg:items-end">
    <div>
      <p class="section-kicker">{{ 'knowledge.eyebrow' | translate }}</p>
      <h2 class="mt-5 text-balance text-4xl font-semibold leading-tight sm:text-5xl">
        {{ 'knowledge.headline' | translate }}
      </h2>
    </div>
    <p class="max-w-xl text-base leading-7 text-[color:var(--muted)] lg:justify-self-end">
      {{ 'knowledge.subtext' | translate }}
    </p>
  </div>

  <div class="mt-12 grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
    @for (group of groups; track group.title) {
      <div class="tech-card hardware-card p-5">
        <h3 class="font-[family-name:var(--font-mono)] text-[11px] uppercase tracking-[0.14em] text-[color:var(--accent-2)]">
          {{ group.title | translate }}
        </h3>
        <div class="mt-5 flex flex-wrap gap-2">
          @for (item of group.items; track item) {
            <span class="rounded-full border border-[var(--line)] bg-[rgba(239,234,222,0.035)] px-3 py-1.5 text-xs text-[color:var(--text-soft)]">
              {{ item }}
            </span>
          }
        </div>
      </div>
    }
  </div>
</section>
