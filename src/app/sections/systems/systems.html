<section id="systems" class="page-wrap section-space border-t border-[var(--line)]">
  <div class="systems-header grid gap-6 lg:grid-cols-[.75fr_1fr] lg:items-end">
    <div>
      <p class="section-kicker">{{ 'systems.eyebrow' | translate }}</p>
      <h2 class="mt-5 text-balance text-4xl font-semibold leading-tight sm:text-5xl">
        {{ 'systems.headline' | translate }}
      </h2>
    </div>
    <p class="max-w-xl text-base leading-7 text-[color:var(--muted)] lg:justify-self-end">
      {{ 'systems.subtext' | translate }}
    </p>
  </div>

  <div class="systems-track mt-12 grid gap-3 md:grid-cols-2 lg:grid-cols-[1.12fr_.94fr_.94fr_.94fr_1.06fr]">
    @for (step of steps; track step.id) {
      <article class="process-card group p-5 transition duration-300 ease-[var(--ease-out)] sm:p-6">
        <div class="flex items-center justify-between gap-4">
          <span class="font-[family-name:var(--font-mono)] text-xs text-[color:var(--accent-2)]">{{ step.number }}</span>
          <span class="rounded-full border border-[var(--line)] px-2.5 py-1 font-[family-name:var(--font-mono)] text-[10px] uppercase tracking-[0.12em] text-[color:var(--muted-2)]">
            {{ step.badge | translate }}
          </span>
        </div>
        <h3 class="mt-10 text-lg font-semibold tracking-tight text-[color:var(--text)]">
          {{ step.title | translate }}
        </h3>
        <p class="mt-3 text-sm leading-6 text-[color:var(--muted)]">
          {{ step.description | translate }}
        </p>
      </article>
    }
  </div>
</section>
