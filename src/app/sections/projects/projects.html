<section id="projects" class="mx-auto max-w-6xl px-4 sm:px-6 lg:px-8 py-6 sm:py-10">

  <div class="relative overflow-hidden rounded-3xl border border-[var(--border)] px-6 py-10 sm:px-10 sm:py-14"
       style="background: rgba(12,11,18,0.55); backdrop-filter: blur(2px);">
    <!-- violet bloom top-left -->
    <div class="pointer-events-none absolute -top-24 -left-24 h-64 w-64 rounded-full blur-3xl
                bg-[radial-gradient(circle,rgba(109,40,217,0.14),transparent_70%)]"></div>
    <!-- fuchsia accent bottom-right -->
    <div class="pointer-events-none absolute -bottom-20 -right-20 h-48 w-48 rounded-full blur-3xl
                bg-[radial-gradient(circle,rgba(232,121,249,0.08),transparent_70%)]"></div>

    <!-- section header -->
    <div class="relative flex items-end justify-between gap-6">
      <div>
        <p class="inline-flex items-center gap-2 text-xs uppercase tracking-widest text-[color:var(--muted2)]">
          <span class="animate-shimmer-x h-px w-6 bg-[rgba(180,140,255,0.7)]"></span>
          Projects
        </p>

        <h2 class="mt-3 text-2xl font-semibold tracking-tight sm:text-3xl">
          Selected work
        </h2>

        <p class="mt-2 max-w-xl text-sm leading-relaxed text-[color:var(--muted2)]">
          A few pieces that reflect my recent focus: product UI, backend integrations, and clean architectures.
        </p>
      </div>
    </div>

    <!-- grid -->
    <div class="relative mt-10 grid gap-3 sm:grid-cols-2">
      @for (p of projects; track p.id) {
        <app-project-card [project]="p" [routerLink]="['/projects', p.id]" class="cursor-pointer" />
      }
    </div>
  </div>

</section>
