<section id="projects" class="page-wrap section-space">
  <div class="projects-header grid gap-6 lg:grid-cols-[.8fr_1fr] lg:items-end">
    <div>
      <p class="section-kicker">{{ 'projects.eyebrow' | translate }}</p>
      <h2 class="mt-5 text-balance text-4xl font-semibold leading-tight sm:text-5xl">
        {{ 'projects.headline' | translate }}
      </h2>
    </div>
    <p class="max-w-xl text-base leading-7 text-[color:var(--muted)] lg:justify-self-end">
      {{ 'projects.subtext' | translate }}
    </p>
  </div>

  <div class="mt-12 grid gap-5 lg:grid-cols-6">
    @for (p of projects; track p.id; let i = $index) {
      <app-project-card
        [project]="p"
        [routerLink]="['/projects', p.id]"
        class="block cursor-pointer"
        [class.lg:col-span-3]="i < 2"
        [class.lg:col-span-2]="i >= 2"
      />
    }
  </div>
</section>
